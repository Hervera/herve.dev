name: Deploy Next.js portfolio to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://herve.dev' }}
      NEXT_PUBLIC_GTAG_ID: ${{ vars.NEXT_PUBLIC_GTAG_ID || 'G-Z4420RG7TZ' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Locate Next.js project
        id: project
        shell: bash
        run: |
          if [ -f InNext/package.json ]; then
            echo "directory=InNext" >> "$GITHUB_OUTPUT"
          else
            echo "directory=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm ci

      - name: Build static portfolio
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run generate

      - name: Check TypeScript
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run typecheck

      - name: Verify SEO for all pages
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run test:seo:static

      - name: Test release activation and failure protection
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run test:deployment

      - name: Deploy to VPS
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: bash deploy/deploy-static.sh

      - name: Verify live deployment through Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          SEO_ORIGIN: ${{ env.NEXT_PUBLIC_SITE_URL }}
          DEPLOYMENT_SHA: ${{ github.sha }}
        run: npm run test:seo
