name: Deploy Next.js portfolio to VPS

# Manual deployment once InNext is committed to its own repository, or this
# workflow is copied to the Portfolio repository's root .github/workflows/.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-next-portfolio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL || 'https://herveranik.com' }}
      NEXT_PUBLIC_GTAG_ID: ${{ vars.NEXT_PUBLIC_GTAG_ID || 'G-Z4420RG7TZ' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Locate Next.js project
        id: project
        shell: bash
        run: |
          if [ -f InNext/package.json ]; then
            echo "directory=InNext" >> "$GITHUB_OUTPUT"
          else
            echo "directory=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ steps.project.outputs.directory }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm ci

      - name: Build static portfolio
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run generate

      - name: Check TypeScript
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run typecheck

      - name: Verify SEO for all pages
        working-directory: ${{ steps.project.outputs.directory }}
        run: npm run test:seo:static

      - name: Package static output
        working-directory: ${{ steps.project.outputs.directory }}
        run: tar -czf "$RUNNER_TEMP/portfolio-next.tar.gz" -C out .

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf -v remote_path '%q' "$VPS_PATH"
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p -- $remote_path && tar -xzf - -C $remote_path" < "$RUNNER_TEMP/portfolio-next.tar.gz"
