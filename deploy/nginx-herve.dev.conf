# Use an origin certificate covering both herve.dev and www.herve.dev.
# Copy nginx-static.conf to /etc/nginx/snippets/herve.dev-static.conf.
server {
    listen 80;
    listen [::]:80;
    server_name herve.dev www.herve.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 308 https://herve.dev$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name herve.dev;
    root /var/www/herve.dev/current;

    ssl_certificate /etc/letsencrypt/live/herve.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/herve.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/herve.dev-static.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.herve.dev;

    ssl_certificate /etc/letsencrypt/live/herve.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/herve.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://herve.dev$request_uri;
}
