# Inside the HTTPS server block for herveranik.com:
# root /var/www/hervera;  # Set to the directory containing out/'s contents.
index index.html;

location / {
    try_files $uri.html $uri $uri/ =404;
}

location ~ ^(/.+)/$ {
    return 308 $1$is_args$args;
}

# Next.js also requests route-specific .txt files for client navigation.
# Upload the entire out/ directory, including _next/ and these files.

error_page 404 /404.html;
location = /404.html {
    internal;
}
