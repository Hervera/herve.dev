# Inside the HTTPS server block for herve.dev:
# root /var/www/herve.dev/current;
index index.html;

location / {
    add_header Cache-Control "no-cache, must-revalidate" always;
    try_files $uri.html $uri $uri/ =404;
}

location ^~ /_next/static/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location ~ ^(/.+)/$ {
    return 308 $1$is_args$args;
}

# Next.js also requests route-specific .txt files for client navigation.
# Upload the entire out/ directory, including _next/ and these files.

error_page 404 /404.html;
location = /404.html {
    internal;
    add_header Cache-Control "no-cache, must-revalidate" always;
}
